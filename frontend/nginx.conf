server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads up to MAX_UPLOAD_MB (20 MB) plus form overhead.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Stream chat tokens to the browser as they arrive, not all at the end.
        proxy_buffering off;
        # A local model on CPU can take a while for the first token.
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths like /documents load index.html,
    # and React Router shows the right page.
    location / {
        try_files $uri /index.html;
    }
}
