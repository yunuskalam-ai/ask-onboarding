# Security headers, sent with every response ("always": error pages too).
# nginx only inherits add_header into a location that has none of its own,
# so both locations include this file.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off; # don't advertise the nginx version

    # Uploads up to MAX_UPLOAD_MB (20 MB) plus form overhead.
    client_max_body_size 25m;

    # The client's real address. Requests reach nginx from Docker's network
    # (Caddy when deployed); those private hops are trusted to say who they're
    # forwarding for, and nginx takes the last address that isn't one of them.
    # The API reads it from X-Real-IP (app/client_info.py).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8000;
        # $http_host, not $host: keep the port, so the API's Origin check
        # (app/security.py) sees the same host:port the browser does.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # Stream chat tokens to the browser as they arrive, not all at the end.
        proxy_buffering off;
        # A local model on CPU can take a while for the first token.
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths like /documents load index.html,
    # and React Router shows the right page.
    location / {
        include /etc/nginx/security-headers.conf;
        # The app: only its own scripts, styles and API. No inline scripts, no
        # framing by other sites, no plugins.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
