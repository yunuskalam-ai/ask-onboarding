# Tool settings for the backend. Dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused names, undefined names
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # modern Python syntax
    "S",       # bandit: security checks
    "SIM",     # simpler equivalents
    "RUF",     # ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design, and fixed fake secrets/paths as test data.
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
